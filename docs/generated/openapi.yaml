# AGO Lock HTTP API 계약 (설계 초안)
# 설계 단계에서는 ADR-014에 따라 수동 갱신합니다.
# 구현 단계에서는 springdoc-openapi로 재생성하고 직접 수정하지 않습니다.
openapi: 3.0.3
info:
  title: AGO Lock API
  version: 0.2.0
  description: |
    개인 물품 관리 앱의 HTTP API 계약입니다.
    인증은 HttpOnly 세션 쿠키를 사용하며, 상태 변경 요청은 X-XSRF-TOKEN 헤더가 필요합니다.
    CSRF 토큰은 GET /auth/csrf 또는 XSRF-TOKEN 쿠키로 획득합니다.
    PATCH는 JSON Merge Patch 의미를 사용하고 version이 필요한 리소스는 version을 필수로 보냅니다.
    생성 요청은 Idempotency-Key를 지원하며 24시간 동안 같은 응답을 재생합니다.
    오류 응답은 application/problem+json 형식을 사용합니다.
servers:
  - url: /api/v1
security:
  - cookieAuth: []
tags:
  - name: auth
  - name: hierarchy
  - name: items
  - name: inventories
  - name: categories
  - name: search
  - name: images
  - name: ai
  - name: sharing
paths:
  /auth/config:
    get:
      tags: [auth]
      operationId: getAuthConfig
      security: []
      responses:
        '200':
          description: 가입·로그인 설정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfig'
  /auth/csrf:
    get:
      tags: [auth]
      operationId: getCsrfToken
      security: []
      responses:
        '200':
          description: CSRF 토큰
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'
  /auth/signup:
    post:
      tags: [auth]
      operationId: signup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: 가입 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMe'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: 초대코드가 필요하거나 유효하지 않음
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMe'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      responses:
        '204':
          description: 로그아웃 성공
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me:
    get:
      tags: [auth]
      operationId: getMe
      responses:
        '200':
          description: 현재 사용자와 Space
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMe'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [auth]
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: 사용자 정보 수정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/password-reset/request:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: 메일 발송 접수
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/password-reset/confirm:
    post:
      tags: [auth]
      operationId: confirmPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '204':
          description: 비밀번호 변경 완료
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          description: 재설정 토큰이 만료되었거나 사용됨
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /spaces/{spaceId}:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    patch:
      tags: [auth]
      operationId: updateSpace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSpaceRequest'
      responses:
        '200':
          description: Space 수정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Space'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /rooms:
    get:
      tags: [hierarchy]
      operationId: listRooms
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Room 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [hierarchy]
      operationId: createRoom
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoomRequest'
      responses:
        '201':
          description: Room 생성
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /shared:
    get:
      tags: [hierarchy]
      operationId: listSharedResources
      responses:
        '200':
          description: 공유받은 Room/Shelf 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedResourceList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /rooms/{roomId}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [hierarchy]
      operationId: getRoom
      responses:
        '200':
          description: Room 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [hierarchy]
      operationId: updateRoom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoomRequest'
      responses:
        '200':
          description: Room 수정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [hierarchy]
      operationId: deleteRoom
      responses:
        '204':
          description: Room 삭제
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /rooms/{roomId}/shelves:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [hierarchy]
      operationId: listShelves
      responses:
        '200':
          description: Shelf 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShelfList'
    post:
      tags: [hierarchy]
      operationId: createShelf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShelfRequest'
      responses:
        '201':
          description: Shelf 생성
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shelf'
        '403':
          $ref: '#/components/responses/Forbidden'
  /shelves/{shelfId}:
    parameters:
      - $ref: '#/components/parameters/ShelfId'
    get:
      tags: [hierarchy]
      operationId: getShelf
      responses:
        '200':
          description: Shelf 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shelf'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [hierarchy]
      operationId: updateShelf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateShelfRequest'
      responses:
        '200':
          description: Shelf 수정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shelf'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [hierarchy]
      operationId: deleteShelf
      responses:
        '204':
          description: Shelf 삭제
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /shelves/{shelfId}/parent:
    parameters:
      - $ref: '#/components/parameters/ShelfId'
    patch:
      tags: [hierarchy]
      operationId: moveShelf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveShelfRequest'
      responses:
        '200':
          description: Shelf 이동
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shelf'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /shelves/{shelfId}/boxes:
    parameters:
      - $ref: '#/components/parameters/ShelfId'
    get:
      tags: [hierarchy]
      operationId: listBoxes
      responses:
        '200':
          description: Box 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoxList'
    post:
      tags: [hierarchy]
      operationId: createBox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBoxRequest'
      responses:
        '201':
          description: Box 생성
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Box'
        '403':
          $ref: '#/components/responses/Forbidden'
  /boxes/{boxId}:
    parameters:
      - $ref: '#/components/parameters/BoxId'
    get:
      tags: [hierarchy]
      operationId: getBox
      responses:
        '200':
          description: Box 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Box'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [hierarchy]
      operationId: updateBox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBoxRequest'
      responses:
        '200':
          description: Box 수정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Box'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [hierarchy]
      operationId: deleteBox
      responses:
        '204':
          description: Box 삭제
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /boxes/{boxId}/parent:
    parameters:
      - $ref: '#/components/parameters/BoxId'
    patch:
      tags: [hierarchy]
      operationId: moveBox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveBoxRequest'
      responses:
        '200':
          description: Box 이동
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Box'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /items:
    get:
      tags: [items]
      operationId: listItems
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: scope
          in: query
          schema:
            type: string
            enum: [ALL, OWNED, SHARED]
            default: ALL
        - name: hasImage
          in: query
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            type: string
            enum: [RELEVANCE, UPDATED_DESC, NAME_ASC, VIEWED_DESC]
            default: UPDATED_DESC
      responses:
        '200':
          description: Item 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemList'
    post:
      tags: [items]
      operationId: createItem
      description: Space 소유자만 신규 Item을 생성할 수 있습니다.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateItemRequest'
      responses:
        '201':
          description: Item 생성
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    get:
      tags: [items]
      operationId: getItem
      responses:
        '200':
          description: Item 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [items]
      operationId: updateItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateItemRequest'
      responses:
        '200':
          description: Item 수정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [items]
      operationId: deleteItem
      responses:
        '204':
          description: Item 삭제
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /items/{itemId}/inventories:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    get:
      tags: [items]
      operationId: listItemInventories
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/InventoryStatus'
      responses:
        '200':
          description: Item의 Inventory 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryList'
        '404':
          $ref: '#/components/responses/NotFound'
  /items/{itemId}/images:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    get:
      tags: [images]
      operationId: listItemImages
      responses:
        '200':
          description: Item 이미지 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageList'
        '404':
          $ref: '#/components/responses/NotFound'
  /items/{itemId}/update-impact:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    get:
      tags: [items]
      operationId: getItemUpdateImpact
      responses:
        '200':
          description: 마스터 수정 영향 범위
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemUpdateImpact'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /inventories:
    get:
      tags: [inventories]
      operationId: listInventories
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: itemId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/InventoryStatus'
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: roomId
          in: query
          schema:
            type: string
            format: uuid
        - name: shelfId
          in: query
          schema:
            type: string
            format: uuid
        - name: boxId
          in: query
          schema:
            type: string
            format: uuid
        - name: scope
          in: query
          schema:
            type: string
            enum: [ALL, OWNED, SHARED]
            default: ALL
        - name: hasImage
          in: query
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            type: string
            enum: [UPDATED_DESC, NAME_ASC, STATUS_ASC, VIEWED_DESC]
            default: UPDATED_DESC
      responses:
        '200':
          description: Inventory 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryList'
    post:
      tags: [inventories]
      operationId: createInventory
      description: 기존 Item에 Inventory를 추가하거나 소유자가 신규 Item과 첫 Inventory를 함께 생성합니다.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInventoryRequest'
      responses:
        '201':
          description: Inventory 생성
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inventory'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /inventories/{inventoryId}:
    parameters:
      - $ref: '#/components/parameters/InventoryId'
    get:
      tags: [inventories]
      operationId: getInventory
      responses:
        '200':
          description: Inventory 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inventory'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [inventories]
      operationId: updateInventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInventoryRequest'
      responses:
        '200':
          description: Inventory 수정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inventory'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [inventories]
      operationId: deleteInventory
      responses:
        '204':
          description: Inventory 삭제
        '403':
          $ref: '#/components/responses/Forbidden'
  /inventories/{inventoryId}/location:
    parameters:
      - $ref: '#/components/parameters/InventoryId'
    patch:
      tags: [inventories]
      operationId: moveInventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveInventoryRequest'
      responses:
        '200':
          description: 이동 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inventory'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /inventories/{inventoryId}/move-targets:
    parameters:
      - $ref: '#/components/parameters/InventoryId'
    get:
      tags: [inventories]
      operationId: listMoveTargets
      responses:
        '200':
          description: 이동 가능한 위치
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /inventories/{inventoryId}/movements:
    parameters:
      - $ref: '#/components/parameters/InventoryId'
    get:
      tags: [inventories]
      operationId: listInventoryMovements
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 이동 이력
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovementList'
        '404':
          $ref: '#/components/responses/NotFound'
  /inventories/{inventoryId}/images:
    parameters:
      - $ref: '#/components/parameters/InventoryId'
    get:
      tags: [images]
      operationId: listInventoryImages
      responses:
        '200':
          description: Inventory 이미지 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageList'
        '404':
          $ref: '#/components/responses/NotFound'
  /categories:
    get:
      tags: [categories]
      operationId: listCategories
      responses:
        '200':
          description: Category 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryList'
    post:
      tags: [categories]
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: Category 생성
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /categories/{categoryId}:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
    patch:
