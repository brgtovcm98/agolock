components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: SESSION
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
    CsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
    SpaceId:
      name: spaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoomId:
      name: roomId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ShelfId:
      name: shelfId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BoxId:
      name: boxId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InventoryId:
      name: inventoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ImageId:
      name: imageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ShareId:
      name: shareId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: 잘못된 요청
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: 인증 필요
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: 권한 없음
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 리소스 없음
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 상태 충돌
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: 검증 실패
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: 요청 한도 초과
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: 외부 AI·이미지 검색 일시 장애
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        fieldErrors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
    User:
      type: object
      required: [id, email, displayName, status]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        status:
          type: string
          enum: [ACTIVE, LOCKED, DELETED]
    Space:
      type: object
      required: [id, name, ownerUserId]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        ownerUserId:
          type: string
          format: uuid
    AuthMe:
      type: object
      required: [user, space]
      properties:
        user:
          $ref: '#/components/schemas/User'
        space:
          $ref: '#/components/schemas/Space'
    AuthConfig:
      type: object
      required: [inviteRequired]
      properties:
        inviteRequired:
          type: boolean
        passwordMinLength:
          type: integer
          default: 10
        passwordMaxLength:
          type: integer
          default: 128
    CsrfTokenResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
    UpdateMeRequest:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
    UpdateSpaceRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
    SignupRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
          maxLength: 128
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        inviteCode:
          type: string
          description: auth.signup.invite-required가 true인 환경에서 필수
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    PasswordResetConfirmRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 10
          maxLength: 128
    SharedResource:
      type: object
      required: [resourceType, resourceId, name, ownerName, permission, sharedAt]
      properties:
        resourceType:
          type: string
          enum: [ROOM, SHELF]
        resourceId:
          type: string
          format: uuid
        name:
          type: string
        path:
          type: string
          description: Room > Shelf 표시 경로
        ownerUserId:
          type: string
          format: uuid
        ownerName:
          type: string
        permission:
          $ref: '#/components/schemas/Permission'
        sharedAt:
          type: string
          format: date-time
    SharedResourceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SharedResource'
    Room:
      type: object
      required: [id, name, version, effectivePermission, isShared]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        effectivePermission:
          $ref: '#/components/schemas/Permission'
        isShared:
          type: boolean
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RoomList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Room'
        nextCursor:
          type: string
          nullable: true
    CreateRoomRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          nullable: true
    UpdateRoomRequest:
      type: object
      required: [version]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          nullable: true
        version:
          type: integer
          format: int64
    Shelf:
      type: object
      required: [id, roomId, name, version, effectivePermission, isShared]
      properties:
        id:
          type: string
          format: uuid
        roomId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        effectivePermission:
          $ref: '#/components/schemas/Permission'
        isShared:
          type: boolean
        version:
          type: integer
          format: int64
    ShelfList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Shelf'
    CreateShelfRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          nullable: true
    UpdateShelfRequest:
      type: object
      required: [version]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
