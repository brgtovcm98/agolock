name: docs

on:
  push:
    paths:
      - "docs/**"
      - "design/**"
      - "README.md"
      - "AGENTS.md"
      - "scripts/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "design/**"
      - "README.md"
      - "AGENTS.md"
      - "scripts/**"
      - ".github/workflows/docs.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python3 -m pip install pyyaml==6.0.3
      - name: Check docs
        run: python3 scripts/docs_check.py
