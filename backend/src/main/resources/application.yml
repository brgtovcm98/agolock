spring:
  application:
    name: agolock
  datasource:
    url: ${DATABASE_URL:}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:}
    password: ${RABBITMQ_PASSWORD:}
    connection-timeout: 3s
  session:
    store-type: jdbc
    timeout: ${AUTH_SESSION_TIMEOUT:30m}
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION
      cleanup-cron: "0 * * * * *"
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:1025}
    from: ${MAIL_FROM:no-reply@agolock.local}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 3000
  jackson:
    default-property-inclusion: non_null
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
  type-handlers-package: com.agolock.common.mybatis.handler
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  servlet:
    session:
      tracking-modes: cookie
      cookie:
        name: SESSION
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: db,rabbit,s3
  health:
    rabbit:
      enabled: true
agolock:
  environment: ${APP_ENVIRONMENT:local}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173}
  storage:
    endpoint: ${S3_ENDPOINT:}
    public-endpoint: ${S3_PUBLIC_ENDPOINT:}
    bucket: ${S3_BUCKET:}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:1025}
    from: ${MAIL_FROM:no-reply@agolock.local}
auth:
  invitation:
    email-discovery-enabled: ${AUTH_INVITATION_EMAIL_DISCOVERY_ENABLED:false}
  signup:
    invite-required: ${AUTH_SIGNUP_INVITE_REQUIRED:true}
  session:
    timeout: ${AUTH_SESSION_TIMEOUT:30m}
    max: ${AUTH_SESSION_MAX:5}
  password-reset:
    ttl: ${AUTH_PASSWORD_RESET_TTL:30m}
  login:
    max-failures: 10
    window: 15m
    lock-duration: 15m
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
logging:
  level:
    root: INFO
    com.agolock: INFO
