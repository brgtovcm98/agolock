spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/agolock}
    username: ${DATABASE_USERNAME:agolock}
    password: ${DATABASE_PASSWORD:agolock}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:agolock}
    password: ${RABBITMQ_PASSWORD:agolock}
agolock:
  environment: local
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    bucket: ${S3_BUCKET:agolock-local}
    access-key: ${S3_ACCESS_KEY:agolock}
    secret-key: ${S3_SECRET_KEY:agolock-local-secret}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
