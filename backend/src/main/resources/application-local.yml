spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/agolock}
    username: ${DATABASE_USERNAME:agolock}
    password: ${DATABASE_PASSWORD:agolock}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:agolock}
    password: ${RABBITMQ_PASSWORD:agolock}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    from: ${MAIL_FROM:no-reply@agolock.local}
management:
  server:
    port: 9090
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
agolock:
  environment: local
  notification:
    secret-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    bucket: ${S3_BUCKET:agolock-local}
    access-key: ${S3_ACCESS_KEY:agolock}
    secret-key: ${S3_SECRET_KEY:agolock-local-secret}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    from: ${MAIL_FROM:no-reply@agolock.local}
