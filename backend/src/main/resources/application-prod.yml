spring:
  flyway:
    enabled: true

server:
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:true}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:framework}

agolock:
  environment: production
  notification:
    secret-key: ${NOTIFICATION_SECRET_KEY:?required}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  server:
    port: 9090

logging:
  level:
    root: INFO
    com.agolock: INFO
